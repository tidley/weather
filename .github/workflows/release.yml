name: Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and attach release zip
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up patched PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.27'
          extensions: curl, zip
          coverage: none

      - name: Prepare build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Verify PHP runtime
        run: |
          php --version
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 4 || version_compare(PHP_VERSION, "8.4.27", "<")) { fwrite(STDERR, "Release validation requires patched PHP 8.4.27 or newer in the 8.4 branch.\n"); exit(1); }'

      - name: Verify source syntax
        run: |
          node --check app.js
          node --check sw.js
          php -l weather.php
          php -l waves.php
          php -l tides.php
          php -l updater.php
          php -l version.php

      - name: Build distribution package
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh

      - name: Verify package
        run: |
          test -f build/weather.zip
          unzip -t build/weather.zip

      - name: Attach package to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: build/weather.zip
          generate_release_notes: true

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: weather
          path: build/weather.zip
